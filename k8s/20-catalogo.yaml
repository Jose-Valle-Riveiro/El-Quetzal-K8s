# Backend: microservicio catalogo (Deployment).
# El Service ClusterIP de este microservicio vive en services.yaml (selector app: catalogo).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogo-holdovers
  namespace: proyecto-2-holdovers
  labels:
    app: catalogo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogo
  template:
    metadata:
      labels:
        app: catalogo
    spec:
      containers:
        - name: catalogo
          image: gotzeth/catalogo:1.0
          ports:
            - containerPort: 5000
          # DB_HOST, DB_PORT, DB_NAME (y URLs entre servicios) vienen del ConfigMap
          envFrom:
            - configMapRef:
                name: catalogo-cfg-holdovers
          # Credenciales desde el Secret: las claves llevan prefijo, el código lee DB_USER / DB_PASSWORD
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret-holdovers
                  key: CATALOGO_DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret-holdovers
                  key: CATALOGO_DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
