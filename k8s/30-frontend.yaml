apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-holdovers
  namespace: proyecto-2-holdovers
  labels:
    app: frontend
spec:
  replicas: 2 # para el escalado, editar este número y volver a hacer kubectl apply
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Imagen de Docker Hub: <usuario>/<repositorio>:<etiqueta>
          image: gotzeth/frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-holdovers
  namespace: proyecto-2-holdovers
  labels:
    app: frontend
spec:
  type: ClusterIP # acceso interno, el punto de entrada es el gateway
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
