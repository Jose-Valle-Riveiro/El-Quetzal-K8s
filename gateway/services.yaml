# Services ClusterIP (acceso interno dentro del clúster).

apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: proyecto-2-holdovers
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80

